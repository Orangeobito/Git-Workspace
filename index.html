<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <style>
    :root {
      --ink: #17202a;
      --muted: #5f6f82;
      --paper: #fffaf0;
      --coral: #ff6f61;
      --teal: #0f9b8e;
      --gold: #f7b801;
      --violet: #6b5bff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      grid-template-rows: auto 1fr;
      place-items: center;
      padding: 24px;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 12% 18%, rgba(247, 184, 1, 0.28), transparent 28%),
        radial-gradient(circle at 86% 76%, rgba(15, 155, 142, 0.24), transparent 26%),
        linear-gradient(135deg, #fff7df 0%, #e8fbff 48%, #fff0f4 100%);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    nav {
      width: min(92vw, 760px);
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 22px;
      padding: 8px;
      border: 1px solid rgba(23, 32, 42, 0.1);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.58);
      box-shadow: 0 14px 42px rgba(23, 32, 42, 0.1);
      backdrop-filter: blur(16px);
    }

    nav a {
      min-width: 92px;
      padding: 10px 16px;
      border-radius: 999px;
      color: var(--ink);
      font-size: 0.92rem;
      font-weight: 800;
      text-align: center;
      text-decoration: none;
      transition: transform 180ms ease, background 180ms ease, color 180ms ease;
    }

    nav a:hover {
      transform: translateY(-2px);
      background: rgba(15, 155, 142, 0.12);
    }

    nav a[aria-current="page"] {
      background: var(--ink);
      color: white;
    }

    main {
      width: min(92vw, 760px);
      padding: 56px;
      position: relative;
      border: 1px solid rgba(23, 32, 42, 0.1);
      border-radius: 28px;
      background: rgba(255, 250, 240, 0.78);
      box-shadow: 0 28px 90px rgba(23, 32, 42, 0.18);
      backdrop-filter: blur(18px);
      text-align: center;
    }

    main::before,
    main::after {
      content: "";
      position: absolute;
      width: 120px;
      height: 120px;
      border-radius: 999px;
      z-index: -1;
      filter: blur(2px);
    }

    main::before {
      top: -38px;
      left: -38px;
      background: conic-gradient(from 90deg, var(--coral), var(--gold), var(--teal), var(--coral));
    }

    main::after {
      right: -44px;
      bottom: -44px;
      background: conic-gradient(from 180deg, var(--violet), var(--teal), var(--gold), var(--violet));
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 22px;
      padding: 8px 14px;
      border: 1px solid rgba(23, 32, 42, 0.14);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.62);
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .spark {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--coral);
      box-shadow: 18px 0 0 var(--gold), 36px 0 0 var(--teal);
    }

    h1 {
      margin: 0;
      font-size: clamp(4rem, 13vw, 8.5rem);
      line-height: 0.9;
      letter-spacing: 0;
    }

    h1 span {
      display: block;
      color: var(--coral);
      text-shadow: 4px 4px 0 rgba(247, 184, 1, 0.45);
    }

    p {
      max-width: 560px;
      margin: 28px auto 0;
      color: var(--muted);
      font-size: clamp(1rem, 2.4vw, 1.25rem);
      line-height: 1.7;
    }

    .shine {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background: linear-gradient(120deg, transparent 20%, rgba(255, 255, 255, 0.65), transparent 45%);
      transform: translateX(-100%);
      animation: sweep 5s ease-in-out infinite;
    }

    @keyframes sweep {
      0%, 35% {
        transform: translateX(-100%);
      }

      60%, 100% {
        transform: translateX(100%);
      }
    }

    @media (max-width: 620px) {
      body {
        padding: 18px;
      }

      nav {
        width: min(100%, 760px);
        gap: 4px;
      }

      nav a {
        min-width: 0;
        flex: 1;
        padding: 10px 8px;
      }

      main {
        width: min(100%, 760px);
        padding: 40px 24px;
        border-radius: 22px;
      }
    }
  </style>
</head>
<body>
  <nav aria-label="Main navigation">
    <a href="index.html" aria-current="page">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>
  <main>
    <div class="shine"></div>
    <div class="eyebrow">
      <span class="spark" aria-hidden="true"></span>
      First page energy
    </div>
    <h1>Hello <span>My name is John Doe</span></h1>
    <p>A tiny HTML page dressed up with glassy polish, warm color, and just enough motion to feel alive.</p>
  </main>
</body>
</html>
