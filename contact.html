<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>
  <style>
    :root {
      --ink: #17202a;
      --muted: #5f6f82;
      --paper: #fffaf0;
      --coral: #ff6f61;
      --teal: #0f9b8e;
      --gold: #f7b801;
      --violet: #6b5bff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      grid-template-rows: auto 1fr;
      place-items: center;
      padding: 24px;
      overflow-x: hidden;
      background:
        linear-gradient(25deg, rgba(107, 91, 255, 0.15) 0 18%, transparent 18% 100%),
        linear-gradient(205deg, rgba(247, 184, 1, 0.2) 0 20%, transparent 20% 100%),
        linear-gradient(135deg, #fff7df 0%, #e8fbff 48%, #fff0f4 100%);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    nav {
      width: min(92vw, 760px);
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 22px;
      padding: 8px;
      border: 1px solid rgba(23, 32, 42, 0.1);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.58);
      box-shadow: 0 14px 42px rgba(23, 32, 42, 0.1);
      backdrop-filter: blur(16px);
    }

    nav a {
      min-width: 92px;
      padding: 10px 16px;
      border-radius: 999px;
      color: var(--ink);
      font-size: 0.92rem;
      font-weight: 800;
      text-align: center;
      text-decoration: none;
      transition: transform 180ms ease, background 180ms ease, color 180ms ease;
    }

    nav a:hover {
      transform: translateY(-2px);
      background: rgba(15, 155, 142, 0.12);
    }

    nav a[aria-current="page"] {
      background: var(--ink);
      color: white;
    }

    main {
      width: min(92vw, 760px);
      padding: 56px;
      border: 1px solid rgba(23, 32, 42, 0.1);
      border-radius: 28px;
      background: rgba(255, 250, 240, 0.78);
      box-shadow: 0 28px 90px rgba(23, 32, 42, 0.18);
      backdrop-filter: blur(18px);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 22px;
      padding: 8px 14px;
      border: 1px solid rgba(23, 32, 42, 0.14);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.62);
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .spark {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--coral);
      box-shadow: 18px 0 0 var(--gold), 36px 0 0 var(--teal);
    }

    h1 {
      margin: 0;
      font-size: clamp(3rem, 9vw, 6.8rem);
      line-height: 0.92;
      letter-spacing: 0;
    }

    h1 span {
      color: var(--violet);
      text-shadow: 4px 4px 0 rgba(15, 155, 142, 0.26);
    }

    p {
      max-width: 600px;
      margin: 28px 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 2.4vw, 1.2rem);
      line-height: 1.7;
    }

    form {
      display: grid;
      gap: 16px;
      margin-top: 34px;
    }

    label {
      display: grid;
      gap: 8px;
      color: var(--ink);
      font-weight: 800;
    }

    input,
    textarea {
      width: 100%;
      padding: 15px 16px;
      border: 1px solid rgba(23, 32, 42, 0.16);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.72);
      color: var(--ink);
      font: inherit;
      outline: none;
      transition: border-color 180ms ease, box-shadow 180ms ease;
    }

    input:focus,
    textarea:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 4px rgba(15, 155, 142, 0.14);
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    button {
      justify-self: start;
      min-width: 152px;
      padding: 14px 20px;
      border: 0;
      border-radius: 999px;
      background: var(--ink);
      color: white;
      font: inherit;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 14px 32px rgba(23, 32, 42, 0.18);
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 38px rgba(23, 32, 42, 0.22);
    }

    @media (max-width: 620px) {
      body {
        padding: 18px;
      }

      nav {
        width: min(100%, 760px);
        gap: 4px;
      }

      nav a {
        min-width: 0;
        flex: 1;
        padding: 10px 8px;
      }

      main {
        width: min(100%, 760px);
        padding: 40px 24px;
        border-radius: 22px;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <nav aria-label="Main navigation">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html" aria-current="page">Contact</a>
  </nav>
  <main>
    <div class="eyebrow">
      <span class="spark" aria-hidden="true"></span>
      Send a note
    </div>
    <h1>Let us <span>connect</span>.</h1>
    <p>This contact form is ready for styling and layout. Since this is a static HTML page, the button keeps things local for now.</p>
    <form>
      <label>
        Name
        <input type="text" name="name" placeholder="Jane Doe">
      </label>
      <label>
        Email
        <input type="email" name="email" placeholder="jane@example.com">
      </label>
      <label>
        Message
        <textarea name="message" placeholder="Write your message here"></textarea>
      </label>
      <button type="button">Send Message</button>
    </form>
  </main>
</body>
</html>
