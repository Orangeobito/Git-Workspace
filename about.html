<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About</title>
  <style>
    :root {
      --ink: #17202a;
      --muted: #5f6f82;
      --paper: #fffaf0;
      --coral: #ff6f61;
      --teal: #0f9b8e;
      --gold: #f7b801;
      --violet: #6b5bff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      grid-template-rows: auto 1fr;
      place-items: center;
      padding: 24px;
      overflow-x: hidden;
      background:
        linear-gradient(115deg, rgba(255, 111, 97, 0.18) 0 16%, transparent 16% 100%),
        linear-gradient(245deg, rgba(15, 155, 142, 0.16) 0 18%, transparent 18% 100%),
        linear-gradient(135deg, #fff7df 0%, #e8fbff 48%, #fff0f4 100%);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    nav {
      width: min(92vw, 760px);
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 22px;
      padding: 8px;
      border: 1px solid rgba(23, 32, 42, 0.1);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.58);
      box-shadow: 0 14px 42px rgba(23, 32, 42, 0.1);
      backdrop-filter: blur(16px);
    }

    nav a {
      min-width: 92px;
      padding: 10px 16px;
      border-radius: 999px;
      color: var(--ink);
      font-size: 0.92rem;
      font-weight: 800;
      text-align: center;
      text-decoration: none;
      transition: transform 180ms ease, background 180ms ease, color 180ms ease;
    }

    nav a:hover {
      transform: translateY(-2px);
      background: rgba(15, 155, 142, 0.12);
    }

    nav a[aria-current="page"] {
      background: var(--ink);
      color: white;
    }

    main {
      width: min(92vw, 760px);
      padding: 56px;
      position: relative;
      border: 1px solid rgba(23, 32, 42, 0.1);
      border-radius: 28px;
      background: rgba(255, 250, 240, 0.78);
      box-shadow: 0 28px 90px rgba(23, 32, 42, 0.18);
      backdrop-filter: blur(18px);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 22px;
      padding: 8px 14px;
      border: 1px solid rgba(23, 32, 42, 0.14);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.62);
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .spark {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--coral);
      box-shadow: 18px 0 0 var(--gold), 36px 0 0 var(--teal);
    }

    h1 {
      max-width: 650px;
      margin: 0;
      font-size: clamp(3rem, 9vw, 6.8rem);
      line-height: 0.92;
      letter-spacing: 0;
    }

    h1 span {
      color: var(--teal);
      text-shadow: 4px 4px 0 rgba(247, 184, 1, 0.45);
    }

    p {
      max-width: 610px;
      margin: 28px 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 2.4vw, 1.2rem);
      line-height: 1.7;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-top: 34px;
    }

    .stat {
      min-height: 118px;
      padding: 20px;
      border: 1px solid rgba(23, 32, 42, 0.1);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.58);
    }

    .stat strong {
      display: block;
      color: var(--coral);
      font-size: 2rem;
      line-height: 1;
    }

    .stat span {
      display: block;
      margin-top: 10px;
      color: var(--muted);
      font-weight: 700;
    }

    @media (max-width: 620px) {
      body {
        padding: 18px;
      }

      nav {
        width: min(100%, 760px);
        gap: 4px;
      }

      nav a {
        min-width: 0;
        flex: 1;
        padding: 10px 8px;
      }

      main {
        width: min(100%, 760px);
        padding: 40px 24px;
        border-radius: 22px;
      }

      .stats {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <nav aria-label="Main navigation">
    <a href="index.html">Home</a>
    <a href="about.html" aria-current="page">About</a>
    <a href="gallery.html">Gallery</a>
    <a href="contact.html">Contact</a>
  </nav>
  <main>
    <div class="eyebrow">
      <span class="spark" aria-hidden="true"></span>
      About this page
    </div>
    <h1>Built to feel <span>bright</span>.</h1>
    <p>This tiny site keeps the hello-world spirit, then gives it a little structure: a home page, an about page, and a contact page that all share the same polished visual language.</p>
    <section class="stats" aria-label="Site highlights">
      <div class="stat">
        <strong>3</strong>
        <span>linked pages</span>
      </div>
      <div class="stat">
        <strong>0</strong>
        <span>dependencies</span>
      </div>
      <div class="stat">
        <strong>1</strong>
        <span>fancy vibe</span>
      </div>
    </section>
  </main>
</body>
</html>
