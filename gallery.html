<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery</title>
  <style>
    :root {
      --ink: #17202a;
      --muted: #5f6f82;
      --paper: #fffaf0;
      --coral: #ff6f61;
      --teal: #0f9b8e;
      --gold: #f7b801;
      --violet: #6b5bff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      grid-template-rows: auto 1fr;
      place-items: center;
      padding: 24px;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 18% 78%, rgba(255, 111, 97, 0.22), transparent 28%),
        radial-gradient(circle at 82% 18%, rgba(107, 91, 255, 0.18), transparent 26%),
        linear-gradient(135deg, #fff7df 0%, #e8fbff 48%, #fff0f4 100%);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    nav {
      width: min(92vw, 760px);
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 22px;
      padding: 8px;
      border: 1px solid rgba(23, 32, 42, 0.1);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.58);
      box-shadow: 0 14px 42px rgba(23, 32, 42, 0.1);
      backdrop-filter: blur(16px);
    }

    nav a {
      min-width: 92px;
      padding: 10px 16px;
      border-radius: 999px;
      color: var(--ink);
      font-size: 0.92rem;
      font-weight: 800;
      text-align: center;
      text-decoration: none;
      transition: transform 180ms ease, background 180ms ease, color 180ms ease;
    }

    nav a:hover {
      transform: translateY(-2px);
      background: rgba(15, 155, 142, 0.12);
    }

    nav a[aria-current="page"] {
      background: var(--ink);
      color: white;
    }

    main {
      width: min(92vw, 900px);
      padding: 48px;
      border: 1px solid rgba(23, 32, 42, 0.1);
      border-radius: 28px;
      background: rgba(255, 250, 240, 0.78);
      box-shadow: 0 28px 90px rgba(23, 32, 42, 0.18);
      backdrop-filter: blur(18px);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 22px;
      padding: 8px 14px;
      border: 1px solid rgba(23, 32, 42, 0.14);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.62);
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .spark {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--coral);
      box-shadow: 18px 0 0 var(--gold), 36px 0 0 var(--teal);
    }

    h1 {
      margin: 0;
      font-size: clamp(3rem, 9vw, 6.8rem);
      line-height: 0.92;
      letter-spacing: 0;
    }

    h1 span {
      color: var(--gold);
      text-shadow: 4px 4px 0 rgba(255, 111, 97, 0.35);
    }

    p {
      max-width: 620px;
      margin: 24px 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 2.4vw, 1.2rem);
      line-height: 1.7;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-top: 34px;
    }

    .piece {
      min-height: 210px;
      display: grid;
      align-content: end;
      padding: 18px;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(23, 32, 42, 0.1);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.58);
      box-shadow: 0 16px 34px rgba(23, 32, 42, 0.1);
    }

    .piece::before {
      content: "";
      position: absolute;
      inset: 16px 16px 58px;
      border-radius: 14px;
      background: var(--art);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.42);
    }

    .piece strong,
    .piece span {
      position: relative;
      z-index: 1;
    }

    .piece strong {
      font-size: 1.05rem;
    }

    .piece span {
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 700;
    }

    .sunrise {
      --art: linear-gradient(160deg, #ff6f61 0 28%, #f7b801 28% 58%, #0f9b8e 58% 100%);
    }

    .lagoon {
      --art: radial-gradient(circle at 28% 32%, #fffaf0 0 12%, transparent 13%),
        linear-gradient(135deg, #0f9b8e, #69d2e7 48%, #6b5bff);
    }

    .confetti {
      --art: radial-gradient(circle at 22% 24%, #ff6f61 0 10%, transparent 11%),
        radial-gradient(circle at 72% 28%, #f7b801 0 12%, transparent 13%),
        radial-gradient(circle at 46% 72%, #0f9b8e 0 14%, transparent 15%),
        linear-gradient(145deg, #fffaf0, #fde2e4);
    }

    @media (max-width: 760px) {
      .gallery {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 620px) {
      body {
        padding: 18px;
      }

      nav {
        width: min(100%, 760px);
        gap: 4px;
      }

      nav a {
        min-width: 0;
        flex: 1;
        padding: 10px 6px;
        font-size: 0.84rem;
      }

      main {
        width: min(100%, 900px);
        padding: 40px 24px;
        border-radius: 22px;
      }
    }
  </style>
</head>
<body>
  <nav aria-label="Main navigation">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="gallery.html" aria-current="page">Gallery</a>
    <a href="contact.html">Contact</a>
  </nav>
  <main>
    <div class="eyebrow">
      <span class="spark" aria-hidden="true"></span>
      Mini gallery
    </div>
    <h1>A small wall of <span>color</span>.</h1>
    <p>A polished gallery page with three bright visual studies, made to match the same warm glassy style as the rest of the site.</p>
    <section class="gallery" aria-label="Gallery items">
      <article class="piece sunrise">
        <strong>Sunrise Stack</strong>
        <span>Coral, gold, teal</span>
      </article>
      <article class="piece lagoon">
        <strong>Quiet Lagoon</strong>
        <span>Soft light and blue</span>
      </article>
      <article class="piece confetti">
        <strong>Confetti Field</strong>
        <span>Playful dots</span>
      </article>
    </section>
  </main>
</body>
</html>
